$kind: http-request
name: Upload Product Media Gallery
method: POST
url: '{{base_url}}/api/products/{{product_id}}/media'
order: 6050
auth:
  type: bearer
  credentials:
    - key: token
      value: '{{token}}'
body:
  type: formdata
  content:
    - key: images[]
      type: file
      src: ''
    - key: clean_previous
      value: 'false'
    - key: set_first_as_cover
      value: 'false'
